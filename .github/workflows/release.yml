name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - run: bun install --frozen-lockfile

      - name: Build binaries
        run: bun run build:release

      # Derives version + notes from this repo's conventional commits and tags
      # this repo as the version anchor. No release or changelog is created here.
      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout scan-action
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/checkout@v4
        with:
          repository: fixentropy-io/fixentropy-scan-action
          token: ${{ secrets.SCAN_ACTION_TOKEN }}
          path: scan-action

      - name: Update binaries + changelog in scan-action
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          NOTES: ${{ steps.semantic.outputs.new_release_notes }}
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
          GH_TOKEN: ${{ secrets.SCAN_ACTION_TOKEN }}
        run: |
          cp dist/fixentropy-linux \
             dist/fixentropy-macos-arm64 \
             dist/fixentropy-macos-x64 \
             dist/fixentropy-windows.exe \
             scan-action/bin/

          CL=scan-action/CHANGELOG.md
          if [ -f "$CL" ]; then
            { printf '# FixEntropy CLI Changelog\n\n%s\n\n' "$NOTES"; tail -n +3 "$CL"; } > "$CL.tmp"
          else
            printf '# FixEntropy CLI Changelog\n\n%s\n' "$NOTES" > "$CL.tmp"
          fi
          mv "$CL.tmp" "$CL"

          cd scan-action
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin CHANGELOG.md
          git commit -m "chore(release): fixentropy-cli ${VERSION}"
          git push origin HEAD
          gh release create "v${VERSION}" \
            --repo fixentropy-io/fixentropy-scan-action \
            --title "fixentropy-cli v${VERSION}" \
            --notes "${NOTES}"
